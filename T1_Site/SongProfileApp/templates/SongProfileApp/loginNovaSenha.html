{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySongProfileApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'SongProfileApp/css/estilo.css' %}">
</head>



<body>
    <div class="login-container">
        <div class="login-box">
            <h1>MySongProfileApp</h1>
            <h2>Login - Nova Senha</h2>
            {% if reset_email %}
                <p>Conta em recuperacao: {{ reset_email }}</p>
            {% endif %}
           
            <form method="post" action="">
                {% csrf_token %}
                <table class="formulario">

                    {{ form.as_table }}
                    <tr>
                        <td></td>
                        <td><input type="submit" value="Nova senha"></td>
                    </tr>

                </table>
            </form>     
        </div>
    </div>
    
</body>

</html>
