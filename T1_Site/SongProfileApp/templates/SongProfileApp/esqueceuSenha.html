{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha</title>
</head>
<body>
    <h1>Recuperação de conta</h1>
    <p>Insira seu e-mail para redefinir sua senha.</p>
    
    {% if mensagem_sucesso %}
        <p style="color: green;">{{ mensagem_sucesso }}</p>
    {% endif %}
    
    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <table class="formulario">
        {{ form.as_table }}
        <tr>
            <td></td>
            {% if mensagem_sucesso %}
                <td><button type="button" onclick="window.location.href='{% url 'homepage' %}'">Voltar para o homepage</button></td>
            {% else %}
                <td><input type="submit" value="Troca senha"></td>
            {% endif %}
        </tr>
        </table>
    </form>
</body>
</html>
