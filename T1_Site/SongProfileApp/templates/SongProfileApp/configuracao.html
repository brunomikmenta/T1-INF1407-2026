{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'SongProfileApp/css/estilo.css' %}">
    <style>
        .config-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .config-card {
            width: 100%;
            margin-left: 650px;
            max-width: 720px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 24px;
            color: #fff;
        }

        .config-card h1 {
            margin-bottom: 8px;
        }

        .config-card p {
            margin-bottom: 20px;
        }

        .config-form {
            display: block;
            max-width: 100%;
        }

        .config-form table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .config-form td {
            vertical-align: middle;
            padding: 0 8px 0 0;
        }

        .config-form td:first-child {
            width: 170px;
            white-space: nowrap;
            font-weight: 600;
        }

        .config-form input,
        .config-form select {
            width: 100%;
            max-width: 320px;
        }

        .config-form input[type="submit"] {
            width: auto;
            padding: 8px 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="config-page">
        <section class="config-card">
            <h1>Configuração</h1>
            <p>Aqui você pode configurar suas preferências e editar sua conta.</p>

            <form method="POST" class="config-form">
                {% csrf_token %}
                <table>
                    {{ form.as_table }}
                    <tr>
                        <td>Senha:</td>
                        <td>
                            <a href="{% url 'esquecisenha' %}" class="btn btn-warning btn-sm">Trocar senha</a>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="submit" value="Atualizar"></td>
                    </tr>
                </table>
            </form>
        </section>
    </main>
</body>
</html>
