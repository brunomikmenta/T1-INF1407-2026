{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySongProfileApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'SongProfileApp/css/estilo.css' %}">
<body>
    
    <header>
        <h1>MySongProfileApp</h1>
    </header>

    <nav id="leftbar">
        <ul>
            
            <li><a class="btn btn-primary" href="{% url 'homepage' %}">Home</a></li>
            <li><a class="btn btn-primary" href="{% url 'perfil' %}">Perfil</a></li>
            <li><a class="btn btn-primary" href="{% url 'configuracao' %}">Configurações</a></li>
            <li class="login-component">
                {% if not app_user %}
                    <a class="btn btn-primary" href="{% url 'login' %}">Login</a>
                {% else %}
                    <a class="btn btn-primary" href="{% url 'logout' %}">Logout</a>
                {% endif %}
            </li>
        </ul>
    </nav>

    <div class='create-list-container'>
        <h1>Crie a sua lista de músicas favoritas:</h1>
        <form action="" method="POST">
            <fieldset style="width: max-content;">
                {% csrf_token %}
                <table>
                    {{ formulario.as_table }}
                </table>
                <button type="submit">Confirmar</button>
            </fieldset>
        </form>



    </div>


</body>
</html>
